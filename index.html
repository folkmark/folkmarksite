<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Primary meta -->
  <title>Folkmark</title>
  <meta name="description" content="Folkmark is a brand and narrative studio — a cultural force for authentic connections.">
  <meta name="theme-color" content="#0A1510">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Folkmark">
  <meta property="og:description" content="A brand and narrative studio — a cultural force for authentic connections.">
  <meta property="og:url" content="https://folkmark.com/">
  <!-- Placeholder OG image: add a 1200×630 og-image.png to the project root. -->
  <meta property="og:image" content="og-image.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Folkmark">
  <meta name="twitter:description" content="A brand and narrative studio — a cultural force for authentic connections.">

  <!-- Placeholder favicon: inline SVG monogram (no external file, no 404). -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231D3C2E'/><text x='16' y='23' font-family='Georgia, serif' font-size='22' fill='%23F7F4EE' text-anchor='middle'>F</text></svg>">

  <!-- Fonts: Instrument Serif (display) + Overpass (UI/body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Overpass:wght@400;600;700&display=swap">

  <link rel="stylesheet" href="styles.css">

  <!-- Decide up front whether this device gets the live 3D mark, so the
       still can stay hidden while the mark rises out of the fog instead of
       flashing first. Phones, reduced-motion and constrained devices keep
       the still (and so does no-JS, since this never runs). -->
  <script>
    (function () {
      try {
        var mm = window.matchMedia, c = navigator.connection, ok = true;
        if (mm && (mm('(prefers-reduced-motion: reduce)').matches || mm('(pointer: coarse)').matches)) { ok = false; }
        if (c && (c.saveData || /(?:^|-)2g$/.test(c.effectiveType || ''))) { ok = false; }
        if (typeof navigator.deviceMemory === 'number' && navigator.deviceMemory < 4) { ok = false; }
        if (ok) { document.documentElement.classList.add('has-3d'); }
      } catch (e) {}
    }());
  </script>
</head>
<body>

  <!-- ============================================================
       HERO — full viewport; the 3D mark sits behind the wordmark
       ============================================================ -->
  <header class="hero" id="top" data-scroll>

    <!-- Masthead lockup: quiet wordmark + studio descriptor, top-left.
         pointer-events are disabled in CSS so the 3D scene stays draggable. -->
    <div class="hero__masthead">
      <h1 class="wordmark">Folkmark</h1>
      <p class="hero__label">Brand &amp; Narrative Studio</p>
    </div>

    <!-- Atmosphere: haze drifting behind the mark, the mark, then a
         low bank drifting in front of it. Decorative (aria-hidden). -->
    <div class="hero__fog hero__fog--back" aria-hidden="true"></div>

    <!-- 3D mark mount. script.js lazily loads the native three.js mark
         (logo3d.js); until then — and for phones, reduced-motion and
         no-JS — the still render below stands in. -->
    <div class="hero__scene" id="logo-mount" aria-hidden="true">
      <img class="hero__poster" src="logo-mark.webp" alt="" width="908" height="900" decoding="async" fetchpriority="high">
    </div>

    <div class="hero__fog hero__fog--front" aria-hidden="true"></div>

    <!-- Quiet scroll cue -->
    <p class="hero__cue">Scroll</p>

  </header>

  <main>

    <!-- ==========================================================
         STATEMENT — one editorial positioning line, lots of air
         ========================================================== -->
    <section class="statement" aria-labelledby="statement-heading">
      <h2 class="statement__text" id="statement-heading">
        <span class="line" data-scroll>A cultural force for</span>
        <span class="line" data-scroll><em>authentic</em> connections.</span>
      </h2>
    </section>

    <!-- ==========================================================
         CONTACT — email as the single call-to-action
         ========================================================== -->
    <section class="contact" aria-labelledby="contact-heading">
      <h2 class="eyebrow" id="contact-heading" data-scroll>Get in touch</h2>
      <a class="contact__email" href="mailto:hello@folkmark.com" data-scroll>hello@folkmark.com</a>
    </section>

  </main>

  <!-- ============================================================
       FOOTER — hairline rule + a single line of small UI type
       ============================================================ -->
  <footer class="footer">
    <p class="footer__mark">© <span id="year">2026</span> Folkmark</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
